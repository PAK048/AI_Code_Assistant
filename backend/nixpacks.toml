[phases.setup]
nixPkgs = ["nodejs-18_x", "python311", "python311Packages.pip"]

[phases.install]
cmds = [
  "npm install --production --no-package-lock",
  "pip install --no-cache-dir -r rag/requirements.txt"
]

[phases.build]
cmds = ["echo 'Build phase complete'"]

[start]
cmd = "node index.js"

[variables]
NODE_ENV = "production"
PORT = "5000"
